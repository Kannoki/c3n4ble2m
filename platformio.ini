[platformio]
default_envs = esp32-c3-mx1508

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

[env:esp32-c3-mx1508]
build_src_filter = +<*.cpp> -<*l298n*>
build_flags = 
    -DCORE_DEBUG_LEVEL=0

[env:esp32-c3-l298n]
build_src_filter = +<*.cpp> -<main.cpp> -<motor_driver.cpp> +<*l298n*>
build_flags = 
    -DCORE_DEBUG_LEVEL=0
